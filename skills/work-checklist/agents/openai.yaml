interface:
  display_name: "Work / 6. Checklist"
  short_description: "Turn conversation into an actionable checklist"
  default_prompt: "Use $work-checklist to turn the current conversation, ideated direction, plan, requirements, or concerns into a concise source-traceable checklist. In Capture mode use the exact table, keep at most 10 items, and invent nothing; execute only when requested, then register one goal and give every item an evidence-backed disposition."
policy:
  allow_implicit_invocation: false
