interface:
  display_name: "Work"
  short_description: "Lead evidence-driven work with bounded agents"
  default_prompt: "Use $work to understand the real user, focus the exact goal, apply trained taste, restore decision friction before cheap implementation, choose the smallest useful team, execute with complete briefs, present the result with care, and verify concrete evidence; use $work-test to inspect real behavior and add meaningful tests, $work-concern for a lightweight read-only sanity check, $work-checklist to register and resolve concerns, $work-ideate to challenge assumptions, or $work-plan and $work-audit for deeper read-only modes."
policy:
  allow_implicit_invocation: false
